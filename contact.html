{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<h1>Contact</h1>

{% if sent %}
    <p class="success">Merci {{ name }}, votre message a bien été reçu.</p>
{% else %}
<form method="post">
    <label>Nom</label>
    <input type="text" name="name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Message</label>
    <textarea name="message" rows="5" required></textarea>
    <button class="btn" type="submit">Envoyer</button>
</form>
{% endif %}
{% endblock %}
